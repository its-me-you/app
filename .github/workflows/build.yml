name: Build BRORAA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q source.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleRelease --no-daemon
        working-directory: src
      - run: cp "$(find src/app/build/outputs/apk/release -name '*.apk' | head -1)" BRORAA.apk
      - run: gh release create "v${{ github.run_number }}" BRORAA.apk --title "BRORAA v${{ github.run_number }}" --notes "Download BRORAA.apk and install it"
        env:
          GH_TOKEN: ${{ github.token }}
